name: pset3

# Servidor de tracking de MLflow:
#   - backend store: PostgreSQL (parámetros, métricas, tags, registro de modelos)
#   - artifact store: volumen Docker servido por el propio servidor (--serve-artifacts),
#     así el cliente sube los modelos por HTTP sin compartir carpetas con el contenedor.
services:
  mlflow-db:
    image: postgres:16.6
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:?Configura MLFLOW_POSTGRES_PASSWORD en .env}
    volumes:
      - mlflow_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mlflow -d mlflow']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  mlflow:
    build: ./mlflow
    image: pset3-mlflow:3.18.0
    depends_on:
      mlflow-db:
        condition: service_healthy
    environment:
      # El job runner de MLflow 3 (tareas GenAI: evaluadores de LLM) lanza ~8 procesos
      # de ~230 MB. Este proyecto solo usa tracking y registro: se desactiva.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: 'false'
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000 --workers 2
      --backend-store-uri postgresql+psycopg2://mlflow:${MLFLOW_POSTGRES_PASSWORD}@mlflow-db:5432/mlflow
      --serve-artifacts --artifacts-destination /mlartifacts
      --allowed-hosts localhost:*,127.0.0.1:*
    ports:
      - '127.0.0.1:5050:5000'
    volumes:
      - mlflow_artifacts:/mlartifacts
    healthcheck:
      test: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    # Sin el job runner, 2 workers usan bastante menos que este límite.
    mem_limit: 1g
    restart: unless-stopped

volumes:
  mlflow_db:
  mlflow_artifacts:
